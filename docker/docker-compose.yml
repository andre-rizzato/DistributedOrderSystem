services:
  # ==================== Infrastructure ====================
  postgres:
    image: postgres:16-alpine
    container_name: dos_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong_Password123
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:latest
    container_name: dos_redis
    ports:
      - "6379:6379"
    networks:
      - dos_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dos_kafka
    hostname: kafka
    ports:
      - "9092:9092"
    networks:
      - dos_network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dos_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    networks:
      - dos_network
    environment:
      KAFKA_CLUSTERS_0_NAME: distributed-order-system
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'

  # ==================== Microservices ====================
  order-service:
    build:
      context: ../src
      dockerfile: OrderService/Dockerfile
    container_name: dos_order_service
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dos_network

  product-service:
    build:
      context: ../src
      dockerfile: ProductService/Dockerfile
    container_name: dos_product_service
    ports:
      - "5198:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dos_network

  inventory-service:
    build:
      context: ../src
      dockerfile: InventoryService/Dockerfile
    container_name: dos_inventory_service
    ports:
      - "5051:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - dos_network

  payment-service:
    build:
      context: ../src
      dockerfile: PaymentService/Dockerfile
    container_name: dos_payment_service
    ports:
      - "5034:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - dos_network

  notification-service:
    build:
      context: ../src
      dockerfile: NotificationService/Dockerfile
    container_name: dos_notification_service
    ports:
      - "5246:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      kafka:
        condition: service_started
    networks:
      - dos_network

  user-service:
    build:
      context: ../src
      dockerfile: UserService/Dockerfile
    container_name: dos_user_service
    ports:
      - "5010:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dos_network

  customer-service:
    build:
      context: ../src
      dockerfile: CustomerService/Dockerfile
    container_name: dos_customer_service
    ports:
      - "5009:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dos_network

  chatbot-service:
    build:
      context: ../src
      dockerfile: ChatbotService/Dockerfile
    container_name: dos_chatbot_service
    ports:
      - "5055:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dos_network

  gateway-bff:
    build:
      context: ../src
      dockerfile: GatewayBff/Dockerfile
    container_name: dos_gateway_bff
    ports:
      - "5189:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      - order-service
      - product-service
      - inventory-service
      - payment-service
      - notification-service
      - user-service
      - customer-service
      - chatbot-service
    networks:
      - dos_network

volumes:
  postgres_data:

networks:
  dos_network:
    driver: bridge