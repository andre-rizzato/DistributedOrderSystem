# Redeploys AgentService only - the one piece of this repo actually running
# on the test VM (rg-agente-atendimento) today. The rest of the solution
# (OrderService, GatewayBff, etc.) runs local-only (see CLAUDE.md), so there
# is nothing else here for this pipeline to touch; a path filter keeps it
# from firing on unrelated .NET changes.
#
# Triggers on `dev` (not `master`) because that's the branch actual commits
# land on day to day - change this if that changes. Never touches the VM's
# agent-service/.env (KEY_VAULT_ENABLED=true means no secret needs to be a
# GitHub secret here either - DEPLOY_SSH_KEY, a dedicated deploy-only key,
# is the only one this workflow uses).
name: Deploy AgentService to test VM

on:
  push:
    branches: [dev]
    paths:
      - "src/AgentService/**"
      - ".github/workflows/deploy-agent-service.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync AgentService to the VM
        # .env excluded on purpose - ORDER_API_BASE_URL/KEY_VAULT_* are
        # VM-local config (today pointed at the dummyjson.com test fallback,
        # see connectors/README.md), not something a deploy should overwrite.
        run: |
          rsync -az --delete \
            --exclude __pycache__ \
            --exclude .venv \
            --exclude .env \
            --exclude .pytest_cache \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./src/AgentService/ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/agent-service/"

      - name: Stop services, install deps, run tests, restart
        # vm-agente is a Standard_B1s (892MB RAM, 1 vCPU) shared with the
        # Node product's own deploy - pip install running concurrently with
        # both pm2 processes already resident locked the VM solid once
        # (unresponsive even at the SSH banner, needed an Azure-level
        # restart). Stopping both services first, not just this one, is the
        # fix on a VM this small - see the matching comment in the Node
        # repo's deploy.yml for the incident this came from. A 1GB
        # swapfile was also added on the VM as a second line of defense,
        # but don't rely on it alone.
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            set -e
            pm2 stop agente-atendimento agent-service || true
            cd ~/agent-service
            .venv/bin/pip install -q -r requirements.txt
            # -m "not rag_eval" excludes the RAGAS-based retrieval quality
            # tests (tests/rag_eval/) - they call paid Claude + Voyage APIs
            # TWICE per case (once through the real graph, once through the
            # RAGAS judge) and carry real LLM-judge variance, so they are
            # not a fit for "must pass on every push" the way the contract
            # tests are. See rag-eval.yml for where they run instead.
            .venv/bin/python -m pytest tests/ -q -m "not rag_eval"
            pm2 restart agente-atendimento agent-service --update-env
            pm2 save
          '
