# Local Qdrant for AgentService dev (Order History RAG Agent).
#
# Lives next to AgentService, not in the repo-root docker/docker-compose.yml
# - AgentService itself already runs outside that compose file (deployed to
# a standalone VM via rsync+PM2, see .github/workflows/deploy-agent-service.yml),
# so its dev dependencies follow the same "lives with the service" convention.
#
# Production note: this is LOCAL-ONLY for now. The shared deploy VM
# (vm-agente, a B1s with 892MB RAM) already locked up once under concurrent
# load from the two services it already runs - adding a third resident
# process there is a real risk, not a theoretical one. Production retrieval
# stays behind the ORDER_HISTORY_RAG_ENABLED feature flag (see rag/config.py)
# until a hosting decision (e.g. Qdrant Cloud free tier) is made deliberately,
# not as a side effect of this change.
#
# Explicit top-level `name:` below is load-bearing, not decorative: Compose
# defaults the project name to the directory's basename, and this directory
# is named "qdrant" - same as CursoClaude/ai/qdrant/docker-compose.yml.
# Without an explicit name the two projects collide (same default project
# "qdrant", same service name, same default volume name) and `docker-compose
# up` here will silently recreate/repoint the COURSE's Qdrant container
# instead of creating a separate one (this happened once while setting this
# file up - no data was lost, but the course's container got replaced until
# this was added).
name: agent-service-qdrant

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-agent-service
    ports:
      - "6333:6333"   # REST/gRPC-over-HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
